# `supabase init` yerine elle yazıldı (Aşama 0'da CLI kurulu değildi).
# Burada olmayan her ayar Supabase CLI varsayılanını kullanır.
project_id = "sezonluk"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
# sign-in: e-posta doğrulama bağlantısı uygulamayı açar; reset-password: F1(e).
additional_redirect_urls = ["sezonluk://sign-in", "sezonluk://reset-password"]
minimum_password_length = 8
enable_signup = true
# F19 misafir modu (bulut projesinde panelden açılır).
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
# F1(c): doğrulanmamış e-posta ile giriş yapılamaz.
enable_confirmations = true
double_confirm_changes = true

[inbucket]
# Yerel doğrulama / şifre sıfırlama e-postaları bu arayüzde görünür.
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "2MiB"

[functions.tmdb-proxy]
# Ağ geçidi JWT ister; fonksiyon ayrıca anon anahtarını reddedip gerçek kullanıcı arar.
verify_jwt = true

[functions.tmdb-sync]
# Kullanıcı değil pg_cron çağırır; fonksiyon service role anahtarını kendisi denetler.
verify_jwt = false

[functions.delete-account]
verify_jwt = true
