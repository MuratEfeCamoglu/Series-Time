# `supabase init` yerine elle yazıldı (Aşama 0'da CLI kurulu değildi).
# Burada olmayan her ayar Supabase CLI varsayılanını kullanır.
project_id = "sezonluk"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["sezonluk://reset-password"]
