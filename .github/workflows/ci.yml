name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    # ubuntu-latest 19 Ekim 2026'dan itibaren Ubuntu 26'ya geçiyor; sürpriz kırılma olmasın diye sabit.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Doğrulama (analyze + format + test)
        run: dart run tool/verify.dart

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: supabase start
        run: supabase start

      - name: supabase test db
        run: supabase test db
